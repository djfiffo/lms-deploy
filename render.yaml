services:
  - type: web
    name: lms-ml-risk
    runtime: python
    rootDir: lms/ml
    buildCommand: python -m compileall -q .
    startCommand: python service.py
    healthCheckPath: /health
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: REQUIRE_API_KEY
        value: "true"
      - key: ML_SERVICE_API_KEY
        generateValue: true
